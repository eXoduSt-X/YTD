name: Build YTD APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Oficial
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev

    - name: Instalar dependencias de Python y Buildozer
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer==1.5.0

    - name: Inyectar Licencias Firmadas en el SDK (Método Limpio)
      run: |
        # Creación manual de la estructura de directorios donde Buildozer guardará el SDK de Android
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        
        # El hash "89366d6e..." representa la firma de los términos y condiciones generales de Android.
        # Al meterlo manualmente en el archivo 'android-sdk-license', el SDK Manager asume que ya abriste el prompt y presionaste "y"
        echo -e "\n89366d6e52fd77bafdee35e756b54bb749d2e413\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        
        # Firma específica para las herramientas de pre-lanzamiento (Preview/Preview License) como las Build-Tools 37-rc
        echo -e "\n849aa67b34d74e261a7c377d53c1390e47085a6d" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Compilar APK con Buildozer
      run: |
        # Buildozer arrancará, detectará que las licencias ya existen en el disco y compilará directo sin preguntar nada
        buildozer android debug

    - name: Subir artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: YTD-APK-Debug
        path: bin/*.apk

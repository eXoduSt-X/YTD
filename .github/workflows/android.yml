name: Compilar APK con Buildozer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Oficial
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev wget curl

    - name: Instalar dependencias de Python y Buildozer Actualizado
      run: |
        pip install --upgrade pip
        pip install "setuptools<70.0.0" wheel
        # Instalamos la última versión estable de Buildozer que ya corrige nativamente el error del sdkmanager
        pip install Cython==0.29.36 buildozer

    - name: Compilar APK con Buildozer
      run: |
        yes | buildozer android debug

    - name: Subir APK generado como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: YTD-Debug-APK
        path: bin/YTD-*-debug.apk
        if-no-files-found: error

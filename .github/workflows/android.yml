name: Build YTD APK

# Eliminamos la opción automática para que SOLO compile cuando tú le des al botón
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Oficial
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependencias del sistema (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev

    - name: Instalar dependencias de Python y Buildozer Estables
      run: |
        pip install --upgrade pip
        # Forzamos las versiones estables previas de Cython y Buildozer
        pip install Cython==0.29.36 buildozer

    - name: Compilar APK con Buildozer
      run: |
        buildozer android debug

    - name: Subir artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: YTD-APK-Debug
        path: bin/*.apk
        

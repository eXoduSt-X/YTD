name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del sistema de Linux (Completas)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            zlib1g-dev \
            liblzma-dev \
            libreadline-dev \
            libncursesw5-dev \
            libgdbm-dev \
            libc6-dev \
            tk-dev \
            libunwind-dev \
            patch \
            unzip \
            zip

      - name: Instalar Buildozer y Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: LIMPIEZA ABSOLUTA DE ENTORNO LOCAL
        run: |
          echo "Destruyendo residuos previos de compilación..."
          rm -rf .buildozer/
          rm -rf bin/
          buildozer android clean || true

      - name: Configurar nueva caché de Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v2-

      - name: Compilar APK con Buildozer de forma directa
        run: |
          export BUILDOZER_WARN_ON_ROOT=0
          
          # AISLAMIENTO: Borramos las variables invasoras del NDK global de la máquina de GitHub
          unset ANDROID_NDK
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          
          # Asegurar que JAVA_HOME apunte al JDK correcto configurado por la acción
          echo "JAVA_HOME de compilación: $JAVA_HOME"
          
          # 1. Forzar la aceptación de licencias mediante el comando secrets inicial de Buildozer
          yes | buildozer android secrets || true
          
          # 2. Si las herramientas base ya existen en la nueva caché, aprobar licencias con el sdkmanager
          if [ -d "$HOME/.buildozer/android/platform/android-sdk/tools/bin" ]; then
            yes | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true
          fi
          
          # 3. Lanzar la compilación limpia e inyectar el "Sí" infinito
          yes | buildozer android debug

      - name: Subir APK compilado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: YTD-Debug-APK
          path: bin/*.apk

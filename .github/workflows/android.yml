name: Compilar APK con Buildozer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Oficial
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev wget curl

    - name: Instalar dependencias de Python y Buildozer Actualizado
      run: |
        pip install --upgrade pip
        # Subimos a buildozer 1.6.0 para reparar los enlaces caídos de las descargas de Python
        pip install Cython==0.29.36 buildozer==1.6.0

    - name: Forzar Aceptación Absoluta de Licencias SDK
      run: |
        # Dejamos exactamente la misma ruta global que ya nos dio el pase libre
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        
        echo -e "24a33b3b769665c128c187d03dfd59540078413d\n893a5cd8a1e6b24d97ea4d862d43e229996d911b\n45f29550827c1b59bb5d906a8d8c1633ccc5a226\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
        echo -e "e9410344250d0e737107669e209353b66ab01af0" > ~/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
        echo -e "075c3874053c73ec33741e4d34cbebb53541bf50" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-arm-dbt-license

    - name: Compilar APK con Buildozer
      run: |
        yes | buildozer android debug

    - name: Subir APK generado como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: YTD-Debug-APK
        path: bin/YTD-*-debug.apk
        if-no-files-found: error

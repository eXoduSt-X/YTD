name: Build YTD APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Oficial
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev

    - name: Instalar dependencias de Python y Buildozer
      run: |
        制造 pip install --upgrade pip
        pip install Cython==0.29.36 buildozer==1.5.0

    - name: Instalar SDK de Android y Auto-aceptar Licencias Oficialmente
      run: |
        # 1. Instalamos el gestor de componentes de Android oficial de la máquina de Ubuntu
        sudo apt-get install -y android-sdk
        
        # 2. Usamos el comando nativo del sistema para firmar digitalmente todas las licencias
        # Esto guarda las firmas en el núcleo del sistema, compartidas para cualquier usuario o programa
        yes | sudo sdkmanager --licenses || true

    - name: Compilar APK con Buildozer
      run: |
        # Al estar las licencias firmadas a nivel global en el sistema,
        # Buildozer heredará las aprobaciones y compilará directamente.
        buildozer android debug

    - name: Subir artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: YTD-APK-Debug
        path: bin/*.apk
        

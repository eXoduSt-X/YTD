name: Build YTD APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Oficial
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev

    - name: Instalar dependencias de Python y Buildozer
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer==1.5.0

    - name: Firmar Licencias de Android Ocultas de Google
      run: |
        # Creamos la carpeta del SDK para que el gestor de licencias no falle
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
        
        # Este comando le dice "sí a todo" a todas las licencias del SDK de Android (incluyendo la misteriosa versión 37)
        # de forma que Buildozer encuentre los contratos ya firmados
        yes | (yes 2>/dev/null || true) | buildozer android debug || true
        
        # Una vez pre-aprobadas las licencias, limpiamos cualquier estado colgado para la compilación real
        buildozer android clean || true

    - name: Compilar APK Real con Buildozer
      run: |
        # Ejecución directa. Las licencias ya fueron aprobadas en el paso anterior.
        buildozer android debug

    - name: Subir artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: YTD-APK-Debug
        path: bin/*.apk

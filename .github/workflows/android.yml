name: Build YTD APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # Forzamos explícitamente la versión 22.04 para recuperar el entorno idéntico a tu éxito
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Oficial
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev

    - name: Instalar dependencias de Python y Buildozer
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer==1.5.0

    - name: Auto-aceptar Licencias de Android SDK
      run: |
        # Creamos de forma anticipada la carpeta de licencias que Buildozer va a generar
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        
        # Inyectamos los hashes de aprobación digital (incluyendo el de la nueva versión 37)
        echo -e "24a33b3b769665c128c187d03dfd59540078413d\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n2710315a60f64d38bc93ee99015c7e096f264877" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Compilar APK con Buildozer
      run: |
        # Usamos el comando 'yes' para responder automáticamente 'y' a cualquier otra pregunta en consola
        yes | buildozer android debug

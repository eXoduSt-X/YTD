name: Build YTD APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev

    - name: Instalar dependencias de Python y Buildozer
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 python-for-android buildozer

    - name: Compilar APK con Buildozer
      run: |
        # Forzar la aceptación de licencias de Android SDK en modo silencioso
        yes | buildozer android debug
      env:
        # Variable opcional para evitar fallos interactivos
        BUILDOZER_ALLOW_KIVY_NEW_DESIGN: 1

    - name: Subir APK generado como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: YTD-Debug-APK
        path: bin/*.apk
        

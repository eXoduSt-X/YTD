name: Build YTD APK

on:
  workflow_dispatch: # Mantiene tu botón manual "Run workflow" tal y como lo recuerdas

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Oficial
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependencias del sistema (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev

    - name: Instalar dependencias de Python y Buildozer
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer

    - name: Aceptar Licencias de Android (Pre-aprobación estricta)
      run: |
        # 1. Crear la ruta exacta donde Buildozer descarga el SDK
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        
        # 2. Inyectar los hashes de aprobación directa para que el SDK de Google no pregunte "Accept? (y/N)"
        echo -e "\n24333f1a50b1b1c67414e811d782547ef223d721\n84831b9409646a918e30573bab4c9c91346d8abd\n43331a78b307477b1b6f88c27a47423e291c81e5" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84934015526d973048dd7765245a4475317748ca" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Compilar APK con Buildozer
      run: |
        # Al tener las licencias pre-aprobadas, pasará directo sin preguntar nada
        buildozer android debug

    - name: Subir artefacto APK
      uses: actions/upload-artifact@v4
      with:
        name: YTD-APK-Debug
        path: bin/*.apk

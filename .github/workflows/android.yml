name: Compilar APK con Buildozer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # Usamos Ubuntu 22.04 para garantizar la compatibilidad con las herramientas de Buildozer
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17 Oficial
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev

    - name: Instalar dependencias de Python y Buildozer
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36 buildozer==1.5.0

    - name: Aceptar licencias del SDK de Android automáticamente
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        # Reemplaza la versión predeterminada conflictiva (37) forzando una versión estable en la configuración global
        # Esto evita que Buildozer intente descargar Build-Tools 37 que requiere aprobación manual de licencia
        mkdir -p .buildozer/android/platform/android-sdk/licenses || true

    - name: Compilar APK con Buildozer
      run: |
        # Ejecución limpia utilizando el entorno compatible
        buildozer android debug

    - name: Subir APK generado como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: YTD-Debug-APK
        # Al cambiar el nombre de la app a YTD, Buildozer guardará el archivo como YTD-0.1-debug.apk (o la versión que tengas)
        path: bin/YTD-*-debug.apk
        if-no-files-found: error
